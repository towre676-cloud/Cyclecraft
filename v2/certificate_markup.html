<figure class="storage-figure" id="certified-risk-figure"><div class="storage-figure-heading"><span class="storage-plate">Numerical plate V · interval arithmetic</span><h3>Count risk remains bounded when an unwanted edge appears</h3></div><canvas id="certificate-canvas" role="img" aria-label="Rigorous probability enclosures for rare shortcuts that close a storage cycle. Markers give enclosed shortcut-event probabilities; the dashed series gives the analytic hazard bound.">The graph compares three rigorous shortcut-event probabilities with a uniform hazard bound for an explicit held protocol.</canvas><figcaption><strong>An explicit finite-horizon guarantee.</strong> The three points use the separately specified dyadic three-hold protocol, evaluated with 320-bit ball arithmetic. A rare edge between the two storage leaves creates a possible auxiliary cycle. Any new winding requires a jump through that edge; the probability of such a jump is bounded by its integrated hazard. Connecting segments guide the eye. These held-protocol probabilities are distinct from the smooth harmonic and convex-synthesis experiments.</figcaption><details><summary>Inspect the numerical enclosures</summary><div id="certificate-enclosures" class="precision-number"></div></details></figure>
